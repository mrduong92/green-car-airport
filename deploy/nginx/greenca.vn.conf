# Customer app — cũng là default_server để truy cập được qua IP trước khi trỏ DNS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name greenca.vn www.greenca.vn 45.124.95.47 _;

    root /var/www/green-car-airport/frontend/dist;
    index index.html;

    include /etc/nginx/snippets/greenca-common.conf;

    error_log  /var/log/nginx/greenca-error.log;
    access_log /var/log/nginx/greenca-access.log;
}

server {
    listen 80;
    listen [::]:80;
    server_name driver.greenca.vn;

    root /var/www/green-car-airport/frontend/dist-driver;
    index index.html;

    include /etc/nginx/snippets/greenca-common.conf;

    error_log  /var/log/nginx/greenca-driver-error.log;
    access_log /var/log/nginx/greenca-driver-access.log;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.greenca.vn;

    root /var/www/green-car-airport/frontend/dist-admin;
    index index.html;

    include /etc/nginx/snippets/greenca-common.conf;

    error_log  /var/log/nginx/greenca-admin-error.log;
    access_log /var/log/nginx/greenca-admin-access.log;
}
