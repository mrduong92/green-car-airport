# Snippet dùng chung cho greenca.vn / driver.greenca.vn / admin.greenca.vn
# Copy vào /etc/nginx/snippets/greenca-common.conf trên server production.

client_max_body_size 20M;

# SPA — root của server block là dist/, dist-driver/ hoặc dist-admin/
location / {
    try_files $uri $uri/ /index.html;
    gzip_static on;
}

# SSE — tắt buffering, tăng timeout, và BẮT BUỘC đi socket pool `sse` riêng.
#
# Mỗi client PWA mở EventSource chiếm TRỌN 1 worker PHP-FPM tới 300s (controller
# blocking trong $redis->subscribe()). Nếu dùng chung socket với `location /api/`
# thì số client realtime >= pm.max_children là mọi API thường phải xếp hàng.
# Sự cố 2026-08-08: pm.max_children=5, unread-count mất 48s trong khi load chỉ 0.17
# (worker không đốt CPU, chúng nằm chờ Redis). Xem deploy/php-fpm/sse.conf.
location = /api/driver/stream {
    fastcgi_pass unix:/run/php/php8.5-fpm-sse.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/green-car-airport/backend/public/index.php;
    include fastcgi_params;
    fastcgi_read_timeout 360;
    fastcgi_buffering off;
}

location = /api/customer/stream {
    fastcgi_pass unix:/run/php/php8.5-fpm-sse.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/green-car-airport/backend/public/index.php;
    include fastcgi_params;
    fastcgi_read_timeout 360;
    fastcgi_buffering off;
}

# API → Laravel (mọi request /api/* đi qua public/index.php)
location /api/ {
    fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/green-car-airport/backend/public/index.php;
    include fastcgi_params;
    fastcgi_read_timeout 60;
}

location ~ /\.(?!well-known).* {
    deny all;
}
