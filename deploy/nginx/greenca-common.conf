# Snippet dùng chung cho greenca.vn / driver.greenca.vn / admin.greenca.vn
# Copy vào /etc/nginx/snippets/greenca-common.conf trên server production.

client_max_body_size 20M;

# SPA — root của server block là dist/, dist-driver/ hoặc dist-admin/
location / {
    try_files $uri $uri/ /index.html;
    gzip_static on;
}

# Asset Vite đã gắn hash nội dung vào tên file → đổi nội dung là đổi tên,
# nên cache vĩnh viễn được. `=404` thay vì rơi về index.html: thiếu file JS mà
# trả về HTML sẽ ra lỗi "Unexpected token '<'" rất khó lần.
# Chỉ dùng add_header, KHÔNG dùng `expires` kèm: hai directive này cùng phát
# Cache-Control nên bật cả hai sẽ ra 2 header trùng trong cùng 1 response.
location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    gzip_static on;
    try_files $uri =404;
}

# ⚠️ NGƯỢC LẠI: 4 file này KHÔNG được cache lâu. Cơ chế tự cập nhật của PWA dựa
# vào việc trình duyệt tải lại chúng — cache nhầm là user kẹt bản cũ vĩnh viễn,
# đẩy bản vá lên cũng vô ích.
location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# SSE — tắt buffering, tăng timeout, và BẮT BUỘC đi socket pool `sse` riêng.
#
# Mỗi client PWA mở EventSource chiếm TRỌN 1 worker PHP-FPM tới 300s (controller
# blocking trong $redis->subscribe()). Nếu dùng chung socket với `location /api/`
# thì số client realtime >= pm.max_children là mọi API thường phải xếp hàng.
# Sự cố 2026-08-08: pm.max_children=5, unread-count mất 48s trong khi load chỉ 0.17
# (worker không đốt CPU, chúng nằm chờ Redis). Xem deploy/php-fpm/sse.conf.
location = /api/driver/stream {
    fastcgi_pass unix:/run/php/php8.5-fpm-sse.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/green-car-airport/backend/public/index.php;
    include fastcgi_params;
    fastcgi_read_timeout 360;
    fastcgi_buffering off;
}

location = /api/customer/stream {
    fastcgi_pass unix:/run/php/php8.5-fpm-sse.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/green-car-airport/backend/public/index.php;
    include fastcgi_params;
    fastcgi_read_timeout 360;
    fastcgi_buffering off;
}

# WebSocket → Reverb (realtime). Trình duyệt kết nối wss://<domain>/app/<key>,
# nginx nâng cấp giao thức rồi chuyển tới tiến trình Reverb ở 127.0.0.1:8081.
#
# Đây là thứ THAY THẾ 2 endpoint SSE: SSE chiếm trọn 1 process PHP-FPM (~50MB)
# cho mỗi người dùng, còn Reverb giữ hàng nghìn kết nối trong một event loop.
location /app/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Kết nối WebSocket đứng im giữa các sự kiện là chuyện bình thường —
    # timeout mặc định 60s sẽ ngắt liên tục và client phải reconnect mãi.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
}

# API → Laravel (mọi request /api/* đi qua public/index.php)
location /api/ {
    fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/green-car-airport/backend/public/index.php;
    include fastcgi_params;
    fastcgi_read_timeout 60;
}

location ~ /\.(?!well-known).* {
    deny all;
}
