; Tuning GreenCA — nạp sau cùng nên ghi đè php.ini distro.

; Mặc định -1 (VÔ HẠN): một request lỗi có thể nuốt hết RAM và giết cả máy.
memory_limit = 256M

; Deploy đã có `systemctl reload php8.5-fpm` nên tắt được stat() mọi file/request.
; ⚠️ Quên reload sau khi đổi code = code mới KHÔNG có hiệu lực, im lặng.
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

realpath_cache_size = 8M
realpath_cache_ttl = 600
