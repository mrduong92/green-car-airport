; Pool RIÊNG cho 2 endpoint SSE (/api/customer/stream, /api/driver/stream).
;
; Lý do tách: mỗi client PWA mở EventSource chiếm TRỌN 1 worker PHP-FPM tới 300s
; (StreamController blocking trong $redis->subscribe()). Dùng chung pool `www`
; thì chỉ cần số client realtime >= pm.max_children là mọi API thường phải xếp
; hàng — đã xảy ra 2026-08-08: unread-count mất 48s trong khi load chỉ 0.17.
;
; ondemand: child sinh theo kết nối, tự chết sau khi stream đóng + idle timeout,
; nên lúc vắng khách không ôm RAM.
[sse]
user = www-data
group = www-data

listen = /run/php/php8.5-fpm-sse.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 30
pm.process_idle_timeout = 15s
pm.max_requests = 200

; Stream tự dừng ở 300s; 360 là lưới an toàn cho kết nối treo.
request_terminate_timeout = 360
